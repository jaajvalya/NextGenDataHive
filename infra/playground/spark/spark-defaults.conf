# ─────────────────────────────────────────────────────────────────────────────
# spark-defaults.conf — Shared Spark configuration for the local playground
# Mounted into both the Spark cluster (EMR simulation) and the Glue container.
#
# Key integrations:
#   • Apache Iceberg   — table format via iceberg-spark-runtime JARs
#   • Project Nessie   — Iceberg REST / Nessie catalog (named "nessie")
#   • MinIO            — S3-compatible object storage via Hadoop S3A
# ─────────────────────────────────────────────────────────────────────────────

# ── Spark master (overridden when submitting with --master) ───────────────────
spark.master                                    spark://spark-master:7077

# ── Iceberg extensions ────────────────────────────────────────────────────────
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# ── Nessie catalog (named "nessie") ──────────────────────────────────────────
# Usage in SQL:  CREATE TABLE nessie.datahive.orders (...)
# Usage in code: spark.table("nessie.datahive.orders")
spark.sql.catalog.nessie                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.catalog-impl           org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.nessie.uri                    http://nessie:19120/api/v2
spark.sql.catalog.nessie.ref                    main
spark.sql.catalog.nessie.warehouse              s3a://iceberg-warehouse/
spark.sql.catalog.nessie.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.nessie.s3.endpoint            http://minio:9000
spark.sql.catalog.nessie.s3.path-style-access   true
spark.sql.catalog.nessie.s3.access-key-id       minioadmin
spark.sql.catalog.nessie.s3.secret-access-key   minioadmin

# ── Default catalog points to Nessie ─────────────────────────────────────────
spark.sql.defaultCatalog                        nessie

# ── MinIO / S3A Hadoop connector ─────────────────────────────────────────────
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                  minioadmin
spark.hadoop.fs.s3a.secret.key                  minioadmin
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
# Disable S3 checksum — required for MinIO compatibility
spark.hadoop.fs.s3a.checksum.validation         false
# Fast-upload enabled for better throughput writing Iceberg manifests
spark.hadoop.fs.s3a.fast.upload                 true
spark.hadoop.fs.s3a.fast.upload.buffer          bytebuffer

# ── Iceberg JARs ─────────────────────────────────────────────────────────────
# Resolved from Maven Central. Versions pinned to match Spark 3.5 / Scala 2.12.
# In the bitnami/spark image these are downloaded on first job submission.
# Glue 4.0 has Iceberg 1.2 pre-bundled; these JARs extend it with Nessie support.
spark.jars.packages                             org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,\
                                                org.projectnessie.nessie-integrations:nessie-spark-extensions-3.5_2.12:0.77.1,\
                                                org.apache.hadoop:hadoop-aws:3.3.4,\
                                                com.amazonaws:aws-java-sdk-bundle:1.12.262,\
                                                software.amazon.awssdk:bundle:2.20.18,\
                                                software.amazon.awssdk:url-connection-client:2.20.18

# ── Spark history server (optional) ──────────────────────────────────────────
spark.eventLog.enabled                          true
spark.eventLog.dir                              /opt/bitnami/spark/logs
spark.history.fs.logDirectory                   /opt/bitnami/spark/logs

# ── Memory / executor tuning (suitable for local 2-core workers) ──────────────
spark.executor.memory                           1g
spark.executor.cores                            2
spark.driver.memory                             1g
spark.driver.maxResultSize                      512m
spark.sql.adaptive.enabled                      true
spark.sql.adaptive.coalescePartitions.enabled   true

# ── Serialization ─────────────────────────────────────────────────────────────
spark.serializer                                org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max                 512m

# ── Delta / write performance ─────────────────────────────────────────────────
spark.sql.shuffle.partitions                    8
spark.default.parallelism                       8

# ── Logging ──────────────────────────────────────────────────────────────────
spark.driver.extraJavaOptions                   -Dlog4j.logger.org.apache.iceberg=INFO \
                                                -Dlog4j.logger.org.projectnessie=INFO

# ── Local mode overrides (used when running spark-submit with --master local) ─
# Uncomment these for local[*] mode outside Docker:
# spark.hadoop.fs.s3a.endpoint          http://localhost:9000
# spark.sql.catalog.nessie.uri          http://localhost:19120/api/v2
# spark.sql.catalog.nessie.s3.endpoint  http://localhost:9000
